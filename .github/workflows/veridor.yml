name: authz
on: pull_request

permissions:
  contents: read
  security-events: write   # for the SARIF upload

jobs:
  veridor:
    runs-on: ubuntu-latest
    steps:
      - name: Make per-run tokens
        run: |
          for name in ACME_TOKEN GLOBEX_TOKEN; do
            token=$(openssl rand -hex 16)
            echo "::add-mask::$token"
            echo "$name=$token" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Start the API
        run: python app.py &
      - uses: Veridor-authz/veridor@f865a6111eb44e14df185f5b30e162de5c3c7a48 # v0.1.0
        id: veridor
        with:
          config: veridor.json
          baseline: veridor/baseline.json
          fail-on: new+confirmed
          wait-for-target: 10
      - if: ${{ always() && steps.veridor.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ steps.veridor.outputs.sarif }}
          category: veridor
